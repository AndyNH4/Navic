name: Build

on:
  push:
    paths:
      - app/**
      - gradle/**
      - androidx-media
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/build.yml
      - "!**/strings.xml"
    tags:
      - 'v*'
    branches:
      - '*'
  pull_request:
    paths:
      - app/**
      - gradle/**
      - androidx-media
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check release signing inputs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          for name in KEYSTORE KEY_ALIAS KEY_PASSWORD KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          if ! printf '%s' "$KEYSTORE" | base64 -d > release.keystore || [ ! -s release.keystore ]; then
            echo "::error::KEYSTORE must be a non-empty base64-encoded keystore"
            exit 1
          fi
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build with Gradle (release)
        id: build_release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          ./gradlew :app:packageRelease --stacktrace
          mv app/build/outputs/apk/**/*.apk ./
          ./gradlew :app:packageRelease -Pfdroid=true --stacktrace
          mv app/build/outputs/apk/**/*.apk ./
          rm release.keystore

      - name: Build with Gradle (debug)
        id: build_debug
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          mv app/build/outputs/apk/**/*.apk ./
          ./gradlew :app:assembleDebug -Pfdroid=true --stacktrace
          mv app/build/outputs/apk/**/*.apk ./

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: rezeener-release-android
          path: ./*.apk
          compression-level: 0
          if-no-files-found: ignore

  upload-artifacts-to-discord:
    name: Upload Artifacts to Discord
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ build-android ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7

      - name: Post artifacts to Discord webhook
        shell: bash
        if: env.CI_BUILD_WEBHOOK
        env:
          CI_BUILD_WEBHOOK: ${{ secrets.CI_BUILD_WEBHOOK }}
        run: |
          shopt -s nullglob globstar

          files=()
          i=1
          for file in **/*.apk; do
            files+=("-F file${i}=@${file}")
            ((i++))
          done

          if (( ${#files[@]} == 0 )); then
            echo "No files to upload"
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          payload=$(jq -n --arg content "Builds for [${GITHUB_SHA::7}](<$run_url>)" '{$content}')

          curl -XPOST "$CI_BUILD_WEBHOOK" -F "payload_json=$payload" "${files[@]}"

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ build-android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" **/Rezeener.apk \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" **/Rezeener.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --draft --generate-notes
          fi
